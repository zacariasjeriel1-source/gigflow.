<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GigFlow Pro - Motor Armónico Avanzado</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#09090b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
:root{--bg:#09090b;--s1:#131316;--s2:#1c1c21;--line:#26262d;--tx:#f5f5f7;--mu:#8e8e9a;--ac:#8b5cf6;--ac2:#ec4899;--ok:#22c55e;--root:#fbbf24;--g:linear-gradient(135deg,#8b5cf6,#ec4899)}
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;transition:background .2s,color .2s}
html,body{height:100%}
body{background:var(--bg);color:var(--tx);-webkit-user-select:none;user-select:none;padding-top:env(safe-area-inset-top)}
input,textarea,select{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.hidden{display:none!important}
svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.f{fill:currentColor;stroke:none}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

/* Vistas */
.view{max-width:520px;margin:0 auto;padding:20px 16px calc(100px + env(safe-area-inset-bottom));animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:2rem;font-weight:800;letter-spacing:-.03em}
.ib{width:42px;height:42px;border-radius:50%;background:var(--s2);display:grid;place-items:center;flex:none}
.search{width:100%;background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:13px 16px;color:var(--tx);font-size:.95rem;margin-bottom:14px;outline:none}
.search:focus{border-color:var(--ac)}
.toolbar-top{display:flex;gap:8px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px}
.pill{background:var(--s1);border:1px solid var(--line);padding:6px 12px;border-radius:20px;font-size:.78rem;font-weight:600;white-space:nowrap;cursor:pointer}
.pill.active{background:var(--ac);color:#fff;border-color:transparent}

.row{display:flex;align-items:center;gap:12px;padding:10px 6px;border-radius:14px;cursor:pointer}
.row:active{background:var(--s1)}
.cover{width:52px;height:52px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:1.3rem;color:#fff;flex:none}
.rt{flex:1;min-width:0}
.rt b{display:block;font-size:1rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rt span{font-size:.82rem;color:var(--mu)}
.tags-preview{display:flex;gap:4px;margin-top:2px}
.tag-badge{font-size:.65rem;background:var(--s2);color:var(--ac);padding:1px 6px;border-radius:6px}
.chip{font-size:.78rem;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--s2);color:var(--ac)}
.btn-icon{background:none;border:none;color:var(--mu);padding:8px;cursor:pointer;border-radius:50%}
.btn-icon:hover{color:var(--tx);background:var(--s2)}
.btn-icon.del:hover{color:#f87171;background:rgba(248,113,113,0.1)}
.empty{text-align:center;color:var(--mu);padding:48px 20px;font-size:.9rem;line-height:1.5}

/* Master Transpose */
.master-bar{background:var(--s1);border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-bottom:16px;display:flex;align-items:center;justify-content:space-between}
.master-bar label{font-size:.85rem;font-weight:600;color:var(--mu)}
.master-bar select{background:var(--s2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;color:var(--tx);font-weight:bold;outline:none}

.fab{position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:50%;background:var(--g);display:grid;place-items:center;box-shadow:0 10px 28px rgba(139,92,246,.45);z-index:40}
.fab svg{width:26px;height:26px;stroke-width:2.5;color:#fff}
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--s1);border-top:1px solid var(--line);padding:8px 0 calc(8px + env(safe-area-inset-bottom));z-index:30}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:600;color:var(--mu)}
.tabs button.on{color:var(--tx)}
.tabs button.on svg{stroke:var(--ac)}

/* Afinador */
#tuner-view{text-align:center;padding-top:36px}
.big{font-size:7rem;font-weight:800;letter-spacing:-.05em;line-height:1;margin:34px 0 4px;transition:color .15s}
.ok .big{color:var(--ok)}
.hz{font-size:.9rem;color:var(--mu);font-variant-numeric:tabular-nums}
.meter{position:relative;height:8px;border-radius:8px;background:var(--s2);margin:36px 20px 14px}
.meter:after{content:"";position:absolute;left:50%;top:-6px;width:2px;height:20px;background:var(--mu);transform:translateX(-50%)}
#needle{position:absolute;top:-8px;left:50%;width:6px;height:24px;border-radius:4px;background:var(--g);transform:translateX(-50%);transition:left .12s}
.ok #needle{background:var(--ok)}
#cents-display{font-size:.9rem;color:var(--mu);min-height:1.4em;margin-bottom:34px}

/* Reproductor / Concierto */
#concert-view{position:fixed;inset:0;z-index:60;background:var(--bg);display:flex;flex-direction:column;max-width:none;padding:env(safe-area-inset-top) 0 0}
.ptop{display:flex;align-items:center;gap:8px;padding:10px 14px;max-width:520px;width:100%;margin:0 auto}
.meta{flex:1;min-width:0;text-align:center}
.meta h2{font-size:1.05rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta p{font-size:.8rem;color:var(--mu)}
.keybar{display:flex;align-items:center;justify-content:center;gap:18px;padding:4px 14px 10px}
.keybar button{width:40px;height:40px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-size:1.3rem;font-weight:600}
.keybar button:active{background:var(--ac)}
.kv{text-align:center;min-width:80px}
.kv small{display:block;font-size:.65rem;color:var(--mu);font-weight:600}
.kv b{font-size:1.5rem;font-weight:800}
.cheat{margin:0 14px 6px;padding:8px 12px;border-radius:12px;background:rgba(251,191,36,.12);color:var(--root);font-size:.8rem;max-width:520px;align-self:center;width:calc(100% - 28px)}
#lyrics-container{flex:1;overflow-y:auto;padding:14px 20px 30px;max-width:520px;width:100%;margin:0 auto;line-height:1.35;-webkit-overflow-scrolling:touch}
.ln{display:flex;flex-wrap:wrap;align-items:flex-end;min-height:1.4em;margin-bottom:10px}
.seg{display:flex;flex-direction:column}
.c{font-style:normal;font-weight:800;font-size:.95rem;color:var(--ac);padding-right:6px;min-height:1.2em;cursor:pointer}
.c:hover{text-decoration:underline}
.t{white-space:pre-wrap;color:var(--tx)}
.tab-line{font-family:ui-monospace,Menlo,monospace;font-size:.8rem;color:var(--mu);white-space:pre;line-height:1.2;width:100%;display:block;margin:2px 0}
.transport{background:var(--s1);border-top:1px solid var(--line);padding:10px 16px calc(12px + env(safe-area-inset-bottom))}
.tin{max-width:520px;margin:0 auto}
.spd{display:flex;align-items:center;gap:10px;font-size:.72rem;color:var(--mu);font-weight:600;margin-bottom:8px}
input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:4px;border-radius:4px;background:var(--line);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--tx)}
.ctl{display:flex;justify-content:space-between;align-items:center}
.ctl .ib.on{background:var(--ac);color:#fff}
.play{width:60px;height:60px;border-radius:50%;background:var(--g);display:grid;place-items:center;box-shadow:0 8px 24px rgba(139,92,246,.45)}
.play svg{width:26px;height:26px;color:#fff}

/* Herramientas y Diapasón */
.sheet{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:flex;align-items:flex-end}
.sh{background:var(--s1);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;padding:16px 18px calc(24px + env(safe-area-inset-bottom));max-height:85dvh;overflow-y:auto}
.grab{width:40px;height:4px;border-radius:4px;background:var(--line);margin:0 auto 14px}
.sh h3{font-size:.95rem;margin:12px 0 6px}
#ai-advice{font-size:.82rem;line-height:1.5;color:var(--mu)}
.fb{margin-top:6px}
.sr{display:flex;align-items:center;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--line);font-size:.72rem}
.sl{width:22px;font-weight:800;color:var(--mu);text-align:center}
.fd{width:24px;height:24px;border-radius:50%;background:var(--s2);display:grid;place-items:center;font-size:.65rem;color:var(--mu)}
.fd.h{background:rgba(139,92,246,.3);color:var(--tx);font-weight:800}
.fd.r{background:var(--root);color:#09090b;font-weight:800}
.act{display:flex;gap:8px;margin-top:16px}
.act button,.bt{flex:1;padding:12px;border-radius:12px;background:var(--s2);font-size:.85rem;font-weight:650}
.act .dg{color:#fca5a5}
.bt.pr{background:var(--g);color:#fff}

/* Modal General */
.modal{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.7);display:flex;align-items:flex-end}
.mc{background:var(--s1);width:100%;max-width:520px;margin:0 auto;border-radius:22px 22px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92dvh;overflow-y:auto}
.mc h3{font-size:1.15rem;margin-bottom:14px}
.mc input,.mc textarea,.mc select{width:100%;background:var(--s2);border:1px solid transparent;border-radius:12px;padding:12px 14px;color:var(--tx);font-size:.95rem;margin-bottom:10px;outline:none}
.mc input:focus,.mc textarea:focus,.mc select:focus{border-color:var(--ac)}
.mc textarea{font-family:ui-monospace,Menlo,monospace;font-size:.85rem;resize:vertical}
.lk{display:flex;gap:8px;margin:2px 0 12px}.lk button{flex:1;padding:10px;border-radius:12px;background:var(--s2);font-size:.8rem;font-weight:650}
.capo{display:flex;flex-wrap:wrap;gap:8px}.capo button{padding:8px 10px;border-radius:10px;background:var(--s2);font-size:.75rem;font-weight:650}.capo button.e{outline:1px solid var(--ac)}.capo button.on{background:var(--g);color:#fff}
.tip{font-size:.78rem;color:var(--mu);margin-top:8px;line-height:1.4}
#webcam-video{display:none}
</style>
</head>
<body>

<!-- BIBLIOTECA -->
<main id="library-view" class="view">
  <div class="top">
    <h1>Biblioteca</h1>
    <div style="display:flex;gap:8px">
      <button class="ib" onclick="exportData()" title="Respaldar JSON"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg></button>
      <button class="ib" onclick="exportSetlistPDF()" title="Exportar PDF"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg></button>
    </div>
  </div>
  <input class="search" id="search-input" placeholder="Buscar canción, artista o #tag" oninput="filterSongs()">
  <div class="toolbar-top" id="tag-filters"></div>
  <div id="songs-list"></div>
</main>

<!-- LISTADO (SETLIST) -->
<main id="setlist-view" class="view hidden">
  <div class="top">
    <h1>Listado</h1>
  </div>
  <div class="master-bar">
    <label>Transposición Global:</label>
    <select id="master-key-select" onchange="applyMasterTranspose(this.value)">
      <option value="">-- Sin cambio global --</option>
    </select>
  </div>
  <div id="setlist-songs-list"></div>
</main>

<!-- AFINADOR -->
<main id="tuner-view" class="view hidden">
  <h1>Afinador</h1>
  <div id="tuner-box" style="margin-top:20px">
    <div class="big" id="note-display">–</div>
    <div class="hz" id="hz-display">0.0 Hz</div>
    <div class="meter"><i id="needle"></i></div>
    <p id="cents-display">Toca una cuerda cerca del micrófono</p>
  </div>
  <button class="bt pr" style="width:100%;max-width:300px;padding:15px;margin-top:20px" id="tuner-btn" onclick="toggleTuner()">Activar micrófono</button>
</main>

<!-- REPRODUCTOR / CONCIERTO -->
<section id="concert-view" class="hidden">
  <div class="ptop">
    <button class="ib" onclick="switchView('setlist')" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="ib" onclick="prevSetlistSong()" aria-label="Anterior"><svg viewBox="0 0 24 24"><path d="M19 20L9 12l10-8v16zM5 4v16H3V4h2z"/></svg></button>
    <div class="meta"><h2 id="player-title"></h2><p id="player-artist"></p></div>
    <button class="ib" onclick="nextSetlistSong()" aria-label="Siguiente"><svg viewBox="0 0 24 24"><path d="M5 4l10 8-10 8V4zM19 4v16h2V4h-2z"/></svg></button>
  </div>
  <div class="keybar">
    <button onclick="shiftKey(-1)" aria-label="Bajar tono">−</button>
    <div class="kv"><small>TONO</small><b id="key-label">C</b></div>
    <button onclick="shiftKey(1)" aria-label="Subir tono">+</button>
  </div>
  <div class="cheat hidden" id="cheat-notes-box">💡 <span id="cheat-text"></span></div>
  <div id="lyrics-container"></div>
  
  <div class="transport"><div class="tin">
    <div class="spd">
      <span>Lento</span><input type="range" id="scroll-speed" min="1" max="10" value="4"><span>Rápido</span>
      <div style="display:flex;gap:4px;margin-left:auto">
        <button class="pill" onclick="adjustZoom(-1)">A-</button>
        <button class="pill" onclick="adjustZoom(1)">A+</button>
      </div>
    </div>
    <div class="ctl">
      <button class="ib" id="face-btn" onclick="toggleFaceTracking()" title="Scroll Facial"><svg viewBox="0 0 24 24"><path d="M3 8V6a2 2 0 012-2h2M17 4h2a2 2 0 012 2v2M21 16v2a2 2 0 01-2 2h-2M7 20H5a2 2 0 01-2-2v-2M9 10v1M15 10v1M9 15c1.5 1.3 4.5 1.3 6 0"/></svg></button>
      <button class="play" id="scroll-btn" onclick="toggleAutoScroll()"></button>
      <button class="ib" onclick="openSheet()" title="Herramientas"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
    </div>
  </div></div>
</section>

<!-- HERRAMIENTAS Y DIAPASÓN -->
<div id="sheet" class="sheet hidden" onclick="if(event.target===this)closeSheet()">
  <div class="sh">
    <div class="grab"></div>
    <h3 style="margin-top:0" id="fretboard-title">Diapasón</h3>
    <div class="fb" id="fretboard-container"></div>
    <h3>Análisis Armónico y Grados</h3>
    <p id="ai-advice"></p>
    <h3>Capo Inteligente</h3>
    <div class="capo" id="capo-box"></div>
    <p class="tip" id="capo-tip"></p>
    <div class="act">
      <button onclick="closeSheet();editCurrentSong()">Editar</button>
      <button onclick="resetTranspose();closeSheet()">Tono Original</button>
      <button class="dg" onclick="closeSheet();deleteCurrentSong()">Borrar</button>
    </div>
  </div>
</div>

<!-- MODAL DE ACORDE CLICKEADO -->
<div id="chord-modal" class="modal hidden" onclick="if(event.target===this)closeChordModal()">
  <div class="mc" style="text-align:center">
    <h3 id="chord-modal-title" style="font-size:1.8rem;color:var(--ac);margin-bottom:10px">Acorde</h3>
    <div id="chord-modal-diagram" style="padding:16px;background:var(--s2);border-radius:12px;display:inline-block;margin-bottom:14px;font-family:monospace;font-size:1.1rem"></div>
    <p id="chord-modal-desc" class="tip"></p>
    <button class="bt pr" onclick="closeChordModal()" style="margin-top:14px">Cerrar</button>
  </div>
</div>

<button class="fab" id="fab" onclick="openModal()" aria-label="Nueva canción"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabs" id="tabs">
  <button id="tab-library" class="on" onclick="switchView('library')"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg>Biblioteca</button>
  <button id="tab-setlist" onclick="switchView('setlist')"><svg viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Listado</button>
  <button id="tab-tuner" onclick="switchView('tuner')"><svg viewBox="0 0 24 24"><path d="M12 2v6M5 12a7 7 0 0014 0M12 19v3M9 22h6"/><rect x="9" y="2" width="6" height="10" rx="3"/></svg>Afinador</button>
</nav>

<video id="webcam-video" autoplay playsinline muted></video>

<!-- MODAL CREAR/EDITAR -->
<div id="song-modal" class="modal hidden" onclick="if(event.target===this)closeModal()">
  <div class="mc">
    <h3 id="modal-title">Nueva canción</h3>
    <input id="new-title" placeholder="Título">
    <input id="new-artist" placeholder="Artista">
    <input id="new-tags" placeholder="Tags (ej: #acústico, #rock)">
    <div class="lk"><button onclick="webSearch('cifraclub')">Buscar Cifra Club</button><button onclick="webSearch('lacuerda')">Buscar La Cuerda</button></div>
    <select id="new-key"></select>
    <textarea id="new-lyrics" rows="7" placeholder="Pega aquí la cifra"></textarea>
    <div class="lk"><button onclick="convertPasted()">✨ Formatear Cifra</button><button onclick="smartAIAutoDetect()">🤖 IA Tono</button></div>
    <input id="new-cheat" placeholder="Nota rápida en vivo (opcional)">
    <div class="act"><button onclick="closeModal()">Cancelar</button><button class="bt pr" onclick="saveSong()">Guardar</button></div>
  </div>
</div>

<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id);
const IC_PLAY='<svg class="f" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 001.5.9l12-7.5a1 1 0 000-1.8l-12-7.5A1 1 0 007 4.5z"/></svg>';
const IC_PAUSE='<svg class="f" viewBox="0 0 24 24"><rect x="6" y="4" width="4.5" height="16" rx="1.2"/><rect x="13.5" y="4" width="4.5" height="16" rx="1.2"/></svg>';

const DEFAULT_SONGS=[{id:1,title:"Hotel California",artist:"Eagles",key:"Bm",tags:"#rock,#clásico",cheat:"Usar pastilla del puente en el solo",lyrics:"[Bm]On a dark desert highway [F#]Cool wind in my hair\n[A]Warm smell of colitas [E]Rising up through the air..."}];
function loadSongs(){try{const d=JSON.parse(localStorage.getItem('gigflow_songs'));if(Array.isArray(d))return d}catch(e){}return DEFAULT_SONGS}
function loadSetlist(){try{const d=JSON.parse(localStorage.getItem('gigflow_setlist'));if(Array.isArray(d))return d}catch(e){}return [1]}
function persist(){try{localStorage.setItem('gigflow_songs',JSON.stringify(songs));localStorage.setItem('gigflow_setlist',JSON.stringify(setlist))}catch(e){}}

let songs=loadSongs(),setlist=loadSetlist(),currentSong=null,playKey=null,editingId=null,capo=0,currentSetlistIndex=-1,activeTagFilter='',currentZoom=1.1;

let wakeLock=null;
async function requestWakeLock(){try{if('wakeLock'in navigator)wakeLock=await navigator.wakeLock.request('screen')}catch(e){}}
function releaseWakeLock(){if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}}

/* MOTOR DE TEORÍA MUSICAL Y ARMONÍA AVANZADA */
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const FLAT_NOTES=['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
const FLATS={Db:'C#',Eb:'D#',Gb:'F#',Ab:'G#',Bb:'A#',D_FLAT:'Db',E_FLAT:'Eb',G_FLAT:'Gb',A_FLAT:'Ab',B_FLAT:'Bb'};
const KEYS=[...NOTES,'Am','A#m','Bm','Cm','C#m','Dm','D#m','Em','Fm','F#m','Gm','G#m'];

const noteIdx=n=>NOTES.indexOf(FLATS[n]||n);
const isMinorKey=k=>/m$/.test(k);
const keyRoot=k=>k.replace(/m$/,'');

const useFlats=k=>{
  const r=keyRoot(k);
  return isMinorKey(k)?['D','G','C','F','A#','D#'].includes(r):['F','A#','D#','G#','C#','Gb'].includes(r);
};

const getNoteName=(i,useFlat)=>(useFlat?FLAT_NOTES:NOTES)[((i%12)+12)%12];
const showKey=k=>getNoteName(noteIdx(keyRoot(k)),useFlats(k))+(isMinorKey(k)?'m':'');

function transposeChord(ch,semitones,useFlat){
  return ch.split('/').map(part=>{
    const m=part.match(/^([A-G][#b]?)(.*)$/);
    if(!m)return part;
    const idx=noteIdx(m[1]);
    if(idx<0)return part;
    return getNoteName(idx+semitones,useFlat)+m[2];
  }).join('/');
}

function semitoneDistance(a,b){
  const x=noteIdx(keyRoot(a)),y=noteIdx(keyRoot(b));
  return(x<0||y<0)?0:(y-x+12)%12;
}

function transposeLyrics(text,semitones,useFlat){
  if(semitones===0)return text;
  return text.replace(/\[(.*?)\]/g,(_,content)=>CH.test(content)?`[${transposeChord(content,semitones,useFlat)}]`:`[${content}]`);
}

const CH=/^[A-G][#b]?(?:maj|min|dim|aug|sus|add|m|M|[0-9]|\+|°|ø|-|b|#|\([^)]*\)|\/[A-G][#b]?)*$/;
const isTabLine=l=>{const t=l.trim();return /^[a-zA-Z]\|/.test(t)||t.includes('---')||t.includes('|-')||t.includes('|--')};
const isChordLine=l=>{
  if(isTabLine(l))return false;const t=l.trim();if(!t)return false;const tokens=t.split(/\s+/);if(!tokens.length)return false;
  let cc=0;for(let tok of tokens)if(CH.test(tok))cc++;
  return cc>0&&(cc/tokens.length>=0.7);
};

function convertChordSheet(text){
  const L=text.replace(/\r/g,'').split('\n'),out=[];let i=0;
  while(i<L.length){
    const l=L[i],trimmed=l.trim();
    if(!trimmed){i++;continue}
    if(isTabLine(l)){out.push(l);i++;continue}
    if(trimmed.startsWith('[')&&trimmed.endsWith(']')&&!isChordLine(trimmed.slice(1,-1))){out.push(trimmed);i++;continue}
    if(/^(Intro|Verso|Estribillo|Coro|Puente|Tab|Final|Solo|Pre-Coro|Interludio)/i.test(trimmed)&&!isChordLine(trimmed)){out.push(`[${trimmed.replace(':','')}]`);i++;continue}
    if(isChordLine(l)){
      let targetIdx=-1;
      for(let j=i+1;j<L.length;j++){
        const cand=L[j].trim();if(!cand)continue;
        if(isChordLine(L[j])||isTabLine(L[j])||/^(Intro|Verso|Estribillo|Coro|Puente)/i.test(cand))break;
        targetIdx=j;break;
      }
      if(targetIdx!==-1){
        let mapped=L[targetIdx];const ms=[...l.matchAll(/\S+/g)];
        for(let k=ms.length-1;k>=0;k--){
          const cc=ms[k][0];if(CH.test(cc)){const p=ms[k].index;if(mapped.length<p)mapped=mapped.padEnd(p,' ');mapped=mapped.slice(0,p)+'['+cc+']'+mapped.slice(p)}
        }
        out.push(mapped.replace(/\s+$/,''));i=targetIdx+1;
      }else{out.push(trimmed.split(/\s+/).map(x=>CH.test(x)?'['+x+']':x).join(' '));i++}
      continue;
    }
    out.push(l);i++;
  }
  return out.join('\n');
}

function detectKeyFromLyrics(lyrics){
  const em=lyrics.match(/(?:tono|key)\s*:\s*([A-G][#b]?m?)/i);if(em&&KEYS.includes(em[1].trim()))return em[1].trim();
  const conv=convertChordSheet(lyrics),m=conv.match(/\[(.*?)\]/g);
  if(m){for(let x of m){const c=x.replace(/[\[\]]/g,'').trim();if(CH.test(c)){const rp=c.split('/')[0],isMin=/m/.test(rp)&&!/maj/.test(rp),rm=rp.match(/^[A-G][#b]?/);if(rm){let r=rm[0];if(FLATS[r])r=FLATS[r];const cand=r+(isMin?'m':'');if(KEYS.includes(cand))return cand;return r}}}}
  return 'C';
}

function renderLyrics(text){
  return text.split('\n').map(line=>{
    if(isTabLine(line))return `<div class="tab-line">${esc(line)}</div>`;
    const p=line.split(/\[(.*?)\]/);let out='';
    if(p[0])out+=`<span class="seg"><i class="c">&nbsp;</i><span class="t">${esc(p[0])}</span></span>`;
    for(let i=1;i<p.length;i+=2){
      const tok=p[i];
      if(CH.test(tok)){out+=`<span class="seg"><i class="c" onclick="showChordDetail('${tok}')">${esc(tok)}</i><span class="t">${esc(p[i+1]||'')||'&nbsp;'}</span></span>`}
      else{out+=`<div style="width:100%;color:var(--ac);font-weight:800;font-size:0.9rem;margin-top:10px;margin-bottom:4px;">[${esc(tok)}]</div>`}
    }
    return `<div class="ln">${out||'&nbsp;'}</div>`;
  }).join('');
}

function adjustZoom(d){

  $('player-title').textContent=currentSong.title;$('player-artist').textContent=currentSong.artist;
  $('key-label').textContent=showKey(playKey)+(capo?' · capo '+capo:'');
  const cb=$('cheat-notes-box');if(currentSong.cheat){$('cheat-text').textContent=currentSong.cheat;cb.classList.remove('hidden')}else cb.classList.add('hidden');
  
  const formatted=convertChordSheet(currentSong.lyrics);
  const sem=semitoneDistance(currentSong.key,playKey);

  $('lyrics-container').innerHTML=renderLyrics(transp);

  let idx=roots.indexOf(keyRoot(playKey));if(idx<0)idx=roots.indexOf(FLATS[keyRoot(playKey)]||'C');
  changeSongKey(roots[(idx+d+12)%12]+(min?'m':''));
}

      `• Grados Diatónicos: <b>I</b> (${noteAt(0)}), <b>ii</b> (${noteAt(2)}m), <b>iii</b> (${noteAt(4)}m), <b>IV</b> (${noteAt(5)}), <b>V</b> (${noteAt(7)}), <b>vi</b> (${noteAt(9)}m), <b>vii°</b> (${noteAt(11)}dim).<br>`+

/* Afinador con Micrófono */
let audioContext=null,analyser=null,micStream=null,tunerRAF=null,lastPitchT=0;
function toggleTuner(){micStream?stopTuner():startTuner()}
async function startTuner(){
  try{
    audioContext=new(window.AudioContext||window.webkitAudioContext)();
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false},video:false});
    analyser=audioContext.createAnalyser();analyser.fftSize=2048;
    audioContext.createMediaStreamSource(micStream).connect(analyser);
    $('tuner-btn').textContent='Detener micrófono';detectPitch(0);
  }catch(e){stopTuner();alert('Permiso de micrófono denegado.')}
}
function stopTuner(){
  cancelAnimationFrame(tunerRAF);tunerRAF=null;
  if(micStream){micStream.getTracks().forEach(t=>t.stop());micStream=null}
  if(audioContext){audioContext.close().catch(()=>{});audioContext=null}
  analyser=null;
  if($('tuner-btn')){$('tuner-btn').textContent='Activar micrófono';$('note-display').textContent='–';$('hz-display').textContent='0.0 Hz';$('cents-display').textContent='Toca una cuerda';$('needle').style.left='50%';$('tuner-box').classList.remove('ok')}
}
function detectPitch(t){
  if(!analyser)return;
  tunerRAF=requestAnimationFrame(detectPitch);
  if(t-lastPitchT<80)return;lastPitchT=t;
  const buf=new Float32Array(analyser.fftSize);analyser.getFloatTimeDomainData(buf);
  const f=autoCorrelate(buf,audioContext.sampleRate);if(f===-1)return;
  const ex=12*Math.log2(f/440)+69,midi=Math.round(ex),cents=Math.round((ex-midi)*100);
  $('note-display').textContent=NOTES[((midi%12)+12)%12];
  $('hz-display').textContent=f.toFixed(1)+' Hz';
  $('needle').style.left=(50+Math.max(-50,Math.min(50,cents)))+'%';
  $('cents-display').textContent=Math.abs(cents)<=5?'Afinada':(cents>0?`Sostenida +${cents} cents`:`Bemol ${cents} cents`);
  $('tuner-box').classList.toggle('ok',Math.abs(cents)<=5);
}
function autoCorrelate(buffer,sr){
  let SIZE=buffer.length,sum=0;
  for(let i=0;i<SIZE;i++)sum+=buffer[i]*buffer[i];
  if(Math.sqrt(sum/SIZE)<0.01)return -1;
  let r1=0,r2=SIZE-1;const th=.2;
  for(let i=0;i<SIZE/2;i++)if(Math.abs(buffer[i])<th){r1=i;break}
  for(let i=1;i<SIZE/2;i++)if(Math.abs(buffer[SIZE-i])<th){r2=SIZE-i;break}
  const buf=buffer.slice(r1,r2);SIZE=buf.length;if(SIZE<64)return -1;
  const c=new Float32Array(SIZE);
  for(let i=0;i<SIZE;i++)for(let j=0;j<SIZE-i;j++)c[i]+=buf[j]*buf[j+i];
  let d=0;while(d<SIZE-1&&c[d]>c[d+1])d++;
  let mv=-1,mp=-1;for(let i=d;i<SIZE;i++)if(c[i]>mv){mv=c[i];mp=i}
  if(mp<1||mp>=SIZE-1)return -1;
  const x1=c[mp-1],x2=c[mp],x3=c[mp+1],a=(x1+x3-2*x2)/2,b=(x3-x1)/2;
  const f=sr/(a?mp-b/(2*a):mp);
  return(f>60&&f<1400)?f:-1;
}

/* Scroll Facial por cámara */
const MP_CAMERA='https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js';
const MP_FACE='https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js';
const MP_BASE='https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/';
let faceMesh=null,camera=null,trackingActive=false,faceAcc=0;
function loadScript(src){return new Promise((res,rej)=>{if([...document.scripts].some(s=>s.src===src))return res();const s=document.createElement('script');s.src=src;s.crossOrigin='anonymous';s.onload=res;s.onerror=()=>rej();document.head.appendChild(s)})}
async function toggleFaceTracking(){
  if(trackingActive){stopFaceTracking();return}
  try{await loadScript(MP_CAMERA);await loadScript(MP_FACE);await startFaceTracking();$('face-btn').classList.add('on')}catch(e){stopFaceTracking();alert('Cámara no disponible.')}
}
async function startFaceTracking(){
  const v=$('webcam-video');faceMesh=new FaceMesh({locateFile:f=>MP_BASE+f});
  faceMesh.setOptions({maxNumFaces:1,refineLandmarks:false,minDetectionConfidence:.5,minTrackingConfidence:.5});
  faceMesh.onResults(r=>{
    if(!trackingActive||!r.multiFaceLandmarks||!r.multiFaceLandmarks.length)return;
    const lm=r.multiFaceLandmarks[0],nose=lm[1],left=lm[234],right=lm[454];
    if(nose&&left&&right){
      const midX=(left.x+right.x)/2,width=Math.abs(right.x-left.x),offset=Math.abs(nose.x-midX);
      if(offset<width*0.28){
        faceAcc+=Number($('scroll-speed').value)*0.12;const st=Math.floor(faceAcc);
        if(st>=1){$('lyrics-container').scrollTop+=st;faceAcc-=st}
      }
    }
  });
  camera=new Camera(v,{onFrame:async()=>{if(trackingActive&&faceMesh)await faceMesh.send({image:v})},width:320,height:240});
  trackingActive=true;await camera.start();
}
function stopFaceTracking(){
  trackingActive=false;faceAcc=0;if(camera){try{camera.stop()}catch(e){}camera=null}
  const v=$('webcam-video');if(v&&v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}
  if(faceMesh){try{faceMesh.close()}catch(e){}faceMesh=null}
  const b=$('face-btn');if(b)b.classList.remove('on');
}

/* Modal guardar */
function openModal(){
  editingId=null;$('modal-title').textContent='Nueva canción';
  ['new-title','new-artist','new-tags','new-lyrics','new-cheat'].forEach(i=>$(i).value='');
  $('new-key').value='C';$('song-modal').classList.remove('hidden');
}
function closeModal(){$('song-modal').classList.add('hidden');editingId=null}
function saveSong(){
  const title=$('new-title').value.trim(),artist=$('new-artist').value.trim(),tags=$('new-tags').value.trim(),cheat=$('new-cheat').value.trim();
  let lyrics=$('new-lyrics').value;if(!title||!lyrics.trim()){alert('Escribe título y letra.');return}
  lyrics=convertChordSheet(lyrics);const key=detectKeyFromLyrics(lyrics)||$('new-key').value;
  if(editingId!==null){
    const s=songs.find(x=>x.id===editingId);if(s){Object.assign(s,{title,artist,tags,key,lyrics,cheat});delete s.playKey}
    if(currentSong&&currentSong.id===editingId){playKey=key;updateSongView()}
  }else{const newId=Date.now();songs.push({id:newId,title,artist,tags,key,cheat,lyrics});setlist.push(newId)}
  persist();closeModal();renderSongs();renderSetlist();
}
function convertPasted(){
  const t=$('new-lyrics');t.value=convertChordSheet(t.value);
  const det=detectKeyFromLyrics(t.value);if(det&&KEYS.includes(det))$('new-key').value=det;
}
function smartAIAutoDetect(){
  convertPasted();const det=detectKeyFromLyrics($('new-lyrics').value);
  $('new-key').value=det;alert(`🤖 Tono detectado: ${det}`);
}
function exportSetlistPDF(){
  const rows=setlist.map((id,i)=>{const s=songs.find(x=>x.id===id);return s?`<li><b>${i+1}. ${esc(s.title)}</b> — ${esc(s.artist)} [${esc(s.key)}]${s.tags?' <small>('+esc(s.tags)+')</small>':''}</li>`:''}).join('');
  const w=window.open('','_blank');if(!w){alert('Permite ventanas emergentes.');return}
  w.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Listado</title><style>body{font-family:sans-serif;padding:24px}li{margin:10px 0;font-size:16px}</style></head><body><h2>GigFlow · Setlist</h2><ol>${rows}</ol><script>window.onload=()=>window.print()<\/script></body></html>`);
  w.document.close();
}

/* Init */
$('new-key').innerHTML=KEYS.map(k=>`<option value="${k}">Tono: ${k}</option>`).join('');
$('new-key').value='C';$('scroll-btn').innerHTML=IC_PLAY;
renderSongs();renderSetlist();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
